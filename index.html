<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --cream: #f7f4ef;
    --dark: #1a1a18;
    --muted: #6b6b62;
    --accent: #8b7355;
    --leaf: #4a6741;
    --border: rgba(26,26,24,0.1);
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Jost', sans-serif; background: var(--cream); color: var(--dark); font-weight: 300; line-height: 1.7; }
  
  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; padding: 1.2rem 3rem; display: flex; justify-content: space-between; align-items: center; background: rgba(247,244,239,0.92); backdrop-filter: blur(8px); border-bottom: 0.5px solid var(--border); }
  .nav-logo { display: flex; align-items: center; gap: 10px; }
  .nav-logo-icon { width: 36px; height: 36px; }
  .nav-logo-text { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 600; letter-spacing: 0.02em; }
  .nav-links { display: flex; gap: 2rem; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; }
  .nav-links a { text-decoration: none; color: var(--muted); transition: color 0.2s; }
  .nav-links a:hover { color: var(--dark); }
  
  .hero { min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr; }
  .hero-left { padding: 12rem 4rem 6rem 6rem; display: flex; flex-direction: column; justify-content: center; }
  .hero-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); margin-bottom: 1.5rem; }
  .hero-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(52px, 6vw, 80px); font-weight: 300; line-height: 1.0; margin-bottom: 1.5rem; }
  .hero-title em { font-style: italic; color: var(--accent); }
  .hero-sub { font-size: 15px; color: var(--muted); max-width: 380px; margin-bottom: 3rem; line-height: 1.8; }
  .hero-cta { display: flex; gap: 12px; flex-wrap: wrap; }
  .btn-primary { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: var(--dark); color: var(--cream); font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border: none; cursor: pointer; transition: background 0.2s; }
  .btn-primary:hover { background: var(--accent); }
  .btn-outline { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: transparent; color: var(--dark); font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s; }
  .btn-outline:hover { border-color: var(--dark); }
  .hero-right { background: #d4cfc6; position: relative; overflow: hidden; }
  .hero-img-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--muted); }
  .hero-img-placeholder svg { opacity: 0.3; }
  .hero-img-placeholder p { font-size: 13px; opacity: 0.6; }
  .hero-badge { position: absolute; bottom: 2.5rem; left: 2.5rem; background: var(--cream); padding: 16px 20px; border-left: 3px solid var(--leaf); }
  .hero-badge-num { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 600; color: var(--dark); }
  .hero-badge-label { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }

  section { padding: 6rem; }
  .section-eyebrow { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--leaf); margin-bottom: 0.75rem; }
  .section-title { font-family: 'Cormorant Garamond', serif; font-size: clamp(32px, 4vw, 48px); font-weight: 300; margin-bottom: 1.5rem; }
  .section-body { color: var(--muted); font-size: 15px; max-width: 560px; }

  .about { background: white; display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; }
  .about-img { background: #ccc9c0; min-height: 480px; position: relative; }
  .about-content { padding: 6rem; display: flex; flex-direction: column; justify-content: center; }
  .about-stats { display: flex; gap: 2.5rem; margin-top: 3rem; padding-top: 2rem; border-top: 0.5px solid var(--border); }
  .about-stat-num { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; color: var(--accent); }
  .about-stat-label { font-size: 12px; color: var(--muted); letter-spacing: 0.05em; }

  .rooms { background: var(--cream); padding: 6rem; }
  .rooms-header { margin-bottom: 3rem; }
  .room-card { background: white; display: grid; grid-template-columns: 1fr 1fr; overflow: hidden; }
  .room-img { min-height: 480px; background: #d0ccc4; position: relative; overflow: hidden; }
  .room-img img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
  .room-img:hover img { transform: scale(1.03); }
  .room-tag { position: absolute; top: 12px; left: 12px; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; background: var(--dark); color: var(--cream); padding: 4px 10px; }
  .room-body { padding: 3rem; display: flex; flex-direction: column; justify-content: center; }
  .room-name { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 400; margin-bottom: 1rem; }
  .room-desc { font-size: 14px; color: var(--muted); margin-bottom: 2rem; line-height: 1.8; }
  .room-amenities { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 2rem; }
  .amenity-tag { font-size: 11px; color: var(--muted); border: 0.5px solid var(--border); padding: 6px 12px; letter-spacing: 0.04em; }
  .room-footer { display: flex; align-items: center; justify-content: space-between; padding-top: 1.5rem; border-top: 0.5px solid var(--border); }
  .room-price-label { font-size: 11px; color: var(--muted); }
  .room-cta { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); text-decoration: none; border-bottom: 0.5px solid var(--accent); padding-bottom: 1px; }

  .amenities { background: white; }
  .amenities-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2.5rem; margin-top: 3rem; }
  .amenity-item { text-align: center; }
  .amenity-icon { width: 48px; height: 48px; margin: 0 auto 1rem; color: var(--leaf); }
  .amenity-name { font-family: 'Cormorant Garamond', serif; font-size: 18px; font-weight: 400; margin-bottom: 0.4rem; }
  .amenity-desc { font-size: 13px; color: var(--muted); }

  .reviews { background: var(--dark); color: var(--cream); }
  .reviews .section-eyebrow { color: rgba(247,244,239,0.4); }
  .reviews .section-title { color: var(--cream); }
  .reviews-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1.5rem; margin-top: 3rem; }
  .review-card { border: 0.5px solid rgba(247,244,239,0.1); padding: 2rem; }
  .review-stars { display: flex; gap: 3px; margin-bottom: 1rem; }
  .star { width: 12px; height: 12px; background: var(--accent); clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); }
  .review-text { font-size: 17px; color: rgba(247,244,239,0.7); line-height: 1.8; margin-bottom: 1.5rem; font-style: italic; font-family: 'Cormorant Garamond', serif; }
  .review-author { font-size: 12px; color: rgba(247,244,239,0.4); letter-spacing: 0.08em; text-transform: uppercase; }
  .reviews-score { display: flex; align-items: center; gap: 1rem; margin-top: 3rem; padding-top: 2rem; border-top: 0.5px solid rgba(247,244,239,0.1); }
  .score-big { font-family: 'Cormorant Garamond', serif; font-size: 64px; font-weight: 300; color: var(--cream); line-height: 1; }
  .score-detail { font-size: 13px; color: rgba(247,244,239,0.5); }
  .score-detail strong { color: rgba(247,244,239,0.8); font-weight: 400; }

  .location { background: var(--cream); display: grid; grid-template-columns: 1fr 1fr; gap: 0; padding: 0; }
  .location-content { padding: 6rem; display: flex; flex-direction: column; justify-content: center; }
  .location-map { background: #c8c4bb; min-height: 480px; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 13px; opacity: 0.6; flex-direction: column; gap: 8px; }
  .location-detail { margin-top: 2rem; font-size: 14px; color: var(--muted); line-height: 2; }
  .location-detail strong { color: var(--dark); font-weight: 400; display: block; }

  .booking-cta { background: var(--leaf); color: var(--cream); padding: 5rem 6rem; text-align: center; }
  .booking-cta .section-eyebrow { color: rgba(247,244,239,0.5); text-align: center; }
  .booking-cta .section-title { color: var(--cream); text-align: center; margin-bottom: 0.75rem; }
  .booking-cta-sub { color: rgba(247,244,239,0.7); font-size: 15px; margin-bottom: 2.5rem; }
  .ota-buttons { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .ota-btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; background: rgba(247,244,239,0.1); color: var(--cream); font-family: 'Jost', sans-serif; font-size: 13px; letter-spacing: 0.06em; text-transform: uppercase; text-decoration: none; border: 1px solid rgba(247,244,239,0.3); cursor: pointer; transition: all 0.2s; }
  .ota-btn:hover { background: rgba(247,244,239,0.2); }
  .ota-btn-dot { width: 8px; height: 8px; border-radius: 50%; }

  footer { background: var(--dark); color: rgba(247,244,239,0.5); padding: 2.5rem 6rem; display: flex; justify-content: space-between; align-items: center; font-size: 13px; }
  footer a { color: rgba(247,244,239,0.5); text-decoration: none; }
  footer a:hover { color: var(--cream); }



  @media (max-width: 900px) {
    nav { padding: 1rem 1.5rem; }
    .nav-links { display: none; }
    .hero { grid-template-columns: 1fr; min-height: auto; }
    .hero-left { padding: 6rem 1.5rem 2.5rem; }
    .hero-title { font-size: clamp(38px, 10vw, 60px); }
    .hero-sub { font-size: 14px; margin-bottom: 2rem; }
    .hero-right { min-height: 55vw; }
    .hero-badge { bottom: 1rem; left: 1rem; padding: 10px 14px; }
    .hero-badge-num { font-size: 22px; }
    section { padding: 3rem 1.5rem; }
    .about { grid-template-columns: 1fr; }
    .about-img { min-height: 260px; }
    .about-content { padding: 2.5rem 1.5rem; }
    .about-stats { gap: 1.5rem; }
    .room-card { grid-template-columns: 1fr; }
    .room-img { min-height: 260px; }
    .room-body { padding: 1.5rem; }
    .room-name { font-size: 24px; }
    .rooms { padding: 3rem 1.5rem; }
    .amenities-grid { grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
    .reviews-grid { grid-template-columns: 1fr; }
    .reviews { padding: 3rem 1.5rem; }
    .reviews-score { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
    .score-big { font-size: 48px; }
    .location { grid-template-columns: 1fr; }
    .location-content { padding: 2.5rem 1.5rem; }
    .location-map { min-height: 260px; }
    .booking-cta { padding: 3rem 1.5rem; }
    .ota-buttons { flex-direction: column; align-items: center; }
    .ota-btn { width: 100%; max-width: 320px; justify-content: center; }
    footer { flex-direction: column; gap: 1rem; text-align: center; padding: 2rem 1.5rem; }
    #lb-thumbs { display: none; }
  }

  @media (max-width: 480px) {
    .hero-left { padding: 5.5rem 1.25rem 2rem; }
    .hero-title { font-size: clamp(32px, 9vw, 46px); line-height: 1.05; }
    .hero-cta { flex-direction: column; }
    .btn-primary, .btn-outline { width: 100%; justify-content: center; text-align: center; }
    .about-stats { flex-wrap: wrap; }
    .amenities-grid { grid-template-columns: 1fr 1fr; gap: 1rem; }
    .amenity-desc { display: none; }
    .section-title { font-size: clamp(26px, 7vw, 36px); }
    .review-text { font-size: 15px; }
    #lightbox button { font-size: 22px; }
  }
</style>
</head>
<body>
